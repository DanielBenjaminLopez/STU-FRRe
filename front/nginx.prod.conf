server {
  listen 80;
  server_name totem.frre.utn.edu.ar;

  root /usr/share/nginx/html;
  index index.html;

  # Proxy institucional y consultas internas del contenedor.
  allow 10.13.1.27;
  allow 127.0.0.1;
  deny all;

  # Permite los videos de hasta 100 MiB más el formulario.
  client_max_body_size 110m;

  if ($http_x_forwarded_proto = http) {
    return 301 https://totem.frre.utn.edu.ar$request_uri;
  }

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

  location ^~ /api/ {
    proxy_pass http://backend:8000;
    proxy_read_timeout 120s;
  }

  location ^~ /django-admin/ {
    proxy_pass http://backend:8000;
  }

  location ^~ /static/ {
    alias /srv/static/;
  }

  location ^~ /media/ {
    alias /srv/media/;
  }

  location ^~ /ws/ {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

    proxy_read_timeout 3600s;
  }

  location /assets/ {
    expires 1y;
    try_files $uri =404;
  }

  location = /index.html {
    expires -1;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  proxy_hide_header X-Content-Type-Options;
  proxy_hide_header X-Frame-Options;
  proxy_hide_header Referrer-Policy;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Strict-Transport-Security "max-age=3600" always;
}
